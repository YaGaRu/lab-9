<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск в каталоге</title>
</head>
<body style="font-family: Arial; margin: 30px">
<h1>Каталог библиотеки</h1>
<form action="catalog" method="get">
    <p>Автор:
        <select name="author">
            <option value="">— любой —</option>
            <option>Булгаков</option>
            <option>Достоевский</option>
            <option>Толстой</option>
            <option>Пелевин</option>
            <option>Гоголь</option>
        </select>
    </p>
    <p>Год издания от: <input type="number" name="year" value="1800"></p>
    <p><input type="submit" value="Найти"></p>
</form>
</body>
</html>
